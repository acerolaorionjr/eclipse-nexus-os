<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Eclipse Nexus OS</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #050816;
  color: #00f0ff;
  overflow: hidden;
}

/* Screens */
.screen {
  display: none;
  height: 100vh;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

.active {
  display: flex;
}

/* Neon text */
h1 {
  text-shadow: 0 0 15px #00f0ff;
}

/* Buttons */
button {
  background: #00f0ff;
  border: none;
  padding: 10px 15px;
  margin-top: 10px;
  cursor: pointer;
  font-weight: bold;
}

input {
  padding: 10px;
  margin-top: 10px;
}
</style>
</head>

<body>

<!-- BOOT -->
<div id="boot" class="screen active">
  <h1>BOOTING ECLIPSE NEXUS OS</h1>
  <p>Initializing system...</p>
</div>

<!-- LOGIN -->
<div id="login" class="screen">
  <h1>LOGIN</h1>
  <input id="user" placeholder="Enter username">
  <button onclick="login()">Enter OS</button>
</div>

<!-- DESKTOP -->
<div id="desktop" class="screen">
  <h1>ECLIPSE NEXUS DESKTOP</h1>

  <div style="margin-bottom:10px;">
    SYSTEM STATUS: ONLINE ⚡
  </div>

  <p id="welcome"></p>

  <button onclick="openGame()">Game Center</button>
  <button onclick="upgrade()">Upgrade to PRO (₦1000)</button>
</div>

<!-- GAME -->
<div id="game" class="screen">
  <h1>NEON RUNNER</h1>
  <p>Game coming next update...</p>
  <button onclick="back()">Back</button>
</div>

<script>

let user = JSON.parse(localStorage.getItem("user")) || { name:"", pro:false };

// HIDE ALL
function hideAll(){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
}

// BOOT SYSTEM
setTimeout(() => {
  hideAll();

  if(user.name){
    showDesktop();
  } else {
    document.getElementById("login").classList.add("active");
  }
}, 2000);

// LOGIN
function login(){
  let name = document.getElementById("user").value;
  if(!name) return;

  user.name = name;
  localStorage.setItem("user", JSON.stringify(user));

  showDesktop();
}

// SHOW DESKTOP
function showDesktop(){
  hideAll();
  document.getElementById("desktop").classList.add("active");

  document.getElementById("welcome").innerText =
    "Welcome " + user.name + (user.pro ? " (PRO)" : " (FREE)");
}

// GAME
function openGame(){
  hideAll();
  document.getElementById("game").classList.add("active");
}

// BACK
function back(){
  showDesktop();
}

// UPGRADE (PAYSTACK)
function upgrade(){
  window.location.href =
  "https://paystack.shop/pay/rlgb3gsjp2";
}

</script>

</body>
</html>
